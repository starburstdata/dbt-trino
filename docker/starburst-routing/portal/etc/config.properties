http-server.http.port=8080

# Database backing the Control Plane's own state
persistence.jdbc.url=jdbc:postgresql://postgres-portal:5432/starburst_portal
persistence.jdbc.user=starburst_portal
persistence.jdbc.password=dbt-trino

# Gateway: proxy queries to the registered SEP backends and route them based
# on tags. Despite the name, AUTO_TAGS is what we want here, not CLIENT_TAGS:
# in 482-e.1, CLIENT_TAGS routing rules are UI-only (no REST API - the
# gateway.routing.type=CLIENT_TAGS decompiled bootstrap message is misleading;
# only AUTO_TAGS binds /public/api/v1/routingRule). The rule condition still
# matches the client's literal X-Trino-Client-Tags header either way, because
# that header is surfaced under the "clientTag" tag key by
# RequestMetadataTagsProvider regardless of routing mode - AUTO_TAGS only
# changes which *additional* tags get derived via tagging rules, which we
# don't use. So this still tests exactly what a dbt client_tags override
# does, just through the routing mode with a public API.
gateway.enabled=true
gateway.routing.type=AUTO_TAGS
gateway.clusters.encryption.secret=secret

# This node only proxies to backends; it has no metastore of its own.
metastore.enabled=false

# At least one sysadmin must be configured for the server to start.
starburst.access-control.authorized-users=admin

web-ui.shared-secret=secret
node.environment=dbt_trino_routing
